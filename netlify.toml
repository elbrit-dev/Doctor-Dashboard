# Netlify configuration for the Doctor Validation Dashboard.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The functions are ES modules (package.json has "type":"module") and import
# shared code from ../../server/*.js. esbuild bundles each function plus those
# imports into one loadable module; WITHOUT this the runtime treats them as
# CommonJS and every call fails to load with
#   "SyntaxError: Cannot use import statement outside a module"  → HTTP 502.
[functions]
  node_bundler = "esbuild"

# Make the frontend's existing fetch('/api/doctors') hit the serverless function.
# Must come BEFORE the SPA catch-all below.
[[redirects]]
  from = "/api/doctors"
  to = "/.netlify/functions/doctors"
  status = 200

# CRM review write-back (POST) → posts a comment on the Lead in ERPNext.
[[redirects]]
  from = "/api/review"
  to = "/.netlify/functions/review"
  status = 200

# Bulk reconciliation: fetch many Leads (+addresses) by doctor code.
[[redirects]]
  from = "/api/leads-by-code"
  to = "/.netlify/functions/leads-by-code"
  status = 200

# Create/update/duplicate triage for an uploaded sheet.
[[redirects]]
  from = "/api/reconcile"
  to = "/.netlify/functions/reconcile"
  status = 200

# Batched create/update of Leads (+addresses) from an uploaded sheet.
[[redirects]]
  from = "/api/process"
  to = "/.netlify/functions/process"
  status = 200

# Batched update of EXISTING Leads (scalar backfill + role profile + address).
[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200

# Read-only audit: report Leads with the same department twice in the Sales Team.
[[redirects]]
  from = "/api/audit-roles"
  to = "/.netlify/functions/audit-roles"
  status = 200

# List the zero-padded Leads (name starts with "DR-0").
[[redirects]]
  from = "/api/zero-leads"
  to = "/.netlify/functions/zero-leads"
  status = 200

# Cascade-delete a batch of Leads by name.
[[redirects]]
  from = "/api/delete-leads"
  to = "/.netlify/functions/delete-leads"
  status = 200

# Merge padded duplicate Leads into their clean form and delete the padded ones.
[[redirects]]
  from = "/api/merge-duplicates"
  to = "/.netlify/functions/merge-duplicates"
  status = 200

# Shared "Completed" tracking across all users (Netlify Blobs).
[[redirects]]
  from = "/api/completed"
  to = "/.netlify/functions/completed"
  status = 200

# Google Drive: list the shared folder's sheets (server-side, no user login).
[[redirects]]
  from = "/api/drive/files"
  to = "/.netlify/functions/drive-files"
  status = 200

# Google Drive: download one folder file's bytes (id is the trailing path segment).
[[redirects]]
  from = "/api/drive/file/:id"
  to = "/.netlify/functions/drive-file/:id"
  status = 200

# SPA fallback — every other route serves the built index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
